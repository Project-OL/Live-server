# LiveKit SFU — template for self-hosted deploys (Hostinger / VPS).
# Production: /etc/livekit.yaml + certs mounted at /etc/letsencrypt
#
# TURN/TLS for restrictive WiFi:
#   - LiveKit listens TLS on 5349 with turn.offoolive.com certs
#   - nginx stream ssl_preread on :443 routes:
#       turn.offoolive.com   -> 127.0.0.1:5349
#       stream.offoolive.com -> 127.0.0.1:8443 (WSS/HLS)
#   - Clients are advertised turns:turn.offoolive.com:443 (LiveKit hardcodes 443)
#
# See deploy/LIVEKIT_VPS_CHECKLIST.md and deploy/nginx-sni-mux.example.conf

port: 7880
bind_addresses:
  - ""

rtc:
  tcp_port: 7881
  port_range_start: 50000
  port_range_end: 60000
  use_external_ip: true
  interfaces:
    excludes:
      - docker0
  ips:
    excludes:
      - 172.17.0.0/16

turn:
  enabled: true
  domain: turn.offoolive.com
  udp_port: 3478
  tls_port: 5349
  external_tls: false
  cert_file: /etc/letsencrypt/live/turn.offoolive.com/fullchain.pem
  key_file: /etc/letsencrypt/live/turn.offoolive.com/privkey.pem

redis:
  address: 127.0.0.1:6379

keys:
  devkey: this_is_a_very_long_secret_key_of_32_chars

logging:
  json: false
  level: info
