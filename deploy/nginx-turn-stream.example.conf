# Example: TLS-terminate TURN in front of LiveKit when
# livekit.yaml has:
#   turn.external_tls: true
#   turn.tls_port: 5349
#   turn.domain: <hostname matching this cert>
#
# IMPORTANT: nginx `http` already binds 0.0.0.0:443 for WSS on
# stream.offoolive.com. You cannot also `listen 443 ssl` in `stream`
# on the same IP without SNI demux or a separate TURN hostname.
#
# Recommended (simplest): dedicated TURN host, e.g. turn.offoolive.com
# DNS A → same VPS IP, certbot cert, then:

# --- /etc/nginx/nginx.conf (top level, sibling of http {}) ---
# stream {
#   include /etc/nginx/stream.d/*.conf;
# }

# --- /etc/nginx/stream.d/turn.conf ---
stream {
    upstream livekit_turn {
        server 127.0.0.1:5349;
    }

    server {
        listen 443 ssl;
        # Prefer a dedicated TURN hostname so this does not fight WSS on
        # stream.offoolive.com:443
        ssl_certificate     /etc/letsencrypt/live/turn.offoolive.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/turn.offoolive.com/privkey.pem;

        proxy_pass livekit_turn;
        proxy_connect_timeout 10s;
        proxy_timeout 10m;
    }
}

# Then in livekit.yaml set:
#   turn.domain: turn.offoolive.com
#
# Alternate (same hostname, no second domain): set external_tls: false,
# point cert_file/key_file at the existing Let's Encrypt cert, open
# TCP 5349 publicly, and let clients use turns:stream.offoolive.com:5349
# (open 5349/tcp in UFW + Hostinger panel).
