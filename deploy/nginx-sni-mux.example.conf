# Production pattern (Hostinger single public IP):
# Public :443 is nginx stream with ssl_preread (TLS passthrough by SNI).
# HTTP nginx for stream.offoolive.com listens only on 127.0.0.1:8443.

# /etc/nginx/stream.d/sni-mux.conf
map $ssl_preread_server_name $sni_backend {
    turn.offoolive.com      127.0.0.1:5349;
    stream.offoolive.com    127.0.0.1:8443;
    default                 127.0.0.1:8443;
}

server {
    listen 443;
    listen [::]:443;
    proxy_pass $sni_backend;
    ssl_preread on;
    proxy_connect_timeout 10s;
    proxy_timeout 10m;
}

# Wire in nginx.conf (top-level, sibling of http {}):
# stream {
#     include /etc/nginx/stream.d/*.conf;
# }
#
# Requires: libnginx-mod-stream
# DNS: turn.offoolive.com A -> VPS public IP
# Certs: certbot for turn.offoolive.com + stream.offoolive.com
# LiveKit: turn.domain=turn.offoolive.com tls_port=5349 cert_file/key_file for turn
