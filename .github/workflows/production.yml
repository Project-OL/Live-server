# Deploys to the staging EC2 (ol-stag) via SSH (existing STAGING_EC2_HOST/STAGING_EC2_USER/
# STAGING_EC2_SSH_PRIVATE_KEY secrets, "staging" environment). The NEW private EC2
# (ol-prod-app-01) is deployed separately by the `prodv2` branch's own workflow via SSM.
#
# This file previously had the wrong trigger (branches: [prodv2], copied verbatim from the
# prodv2 branch) so pushes to `staging` deployed nothing. Fixed to trigger on `staging`.
# Test push 2026-09-04 to re-verify SSH connectivity from GitHub Actions.
name: Staging build and deploy

on:
  push:
    branches: [staging]
  workflow_dispatch:

concurrency:
  group: staging-ec2-live-server
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies (validate lockfile + Prisma)
        run: npm ci
        env:
          DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/ci

      - name: Pack artifact
        run: |
          tar -czf live-server-artifact.tgz \
            --exclude=node_modules \
            --exclude=.git \
            --exclude=.env \
            --exclude=scratch \
            --exclude=exp.js \
            --exclude=test-creds.txt \
            --exclude=google-credentials.json \
            server.js package.json package-lock.json prisma prisma.config.ts src public scripts
          ls -lh live-server-artifact.tgz

      - name: Upload GitHub Actions artifact
        uses: actions/upload-artifact@v4
        with:
          name: live-server-${{ github.sha }}
          path: live-server-artifact.tgz
          retention-days: 14

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4

      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: live-server-${{ github.sha }}

      - name: Check staging EC2 secrets
        env:
          KEY: ${{ secrets.STAGING_EC2_SSH_PRIVATE_KEY }}
          HOST: ${{ secrets.STAGING_EC2_HOST }}
          USER: ${{ secrets.STAGING_EC2_USER }}
        run: |
          if [ -z "$KEY" ] || [ -z "$HOST" ] || [ -z "$USER" ]; then
            echo "Set Environment staging secrets: STAGING_EC2_HOST, STAGING_EC2_USER, STAGING_EC2_SSH_PRIVATE_KEY"
            exit 1
          fi

      - name: Deploy to EC2
        env:
          SSH_PRIVATE_KEY: ${{ secrets.STAGING_EC2_SSH_PRIVATE_KEY }}
          EC2_HOST: ${{ secrets.STAGING_EC2_HOST }}
          EC2_USER: ${{ secrets.STAGING_EC2_USER }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -H "$EC2_HOST" >> ~/.ssh/known_hosts || true

          SCP_OK=0
          for i in 1 2 3 4; do
            if scp -i ~/.ssh/id_deploy \
                -o IdentitiesOnly=yes \
                -o StrictHostKeyChecking=accept-new \
                -o ConnectTimeout=20 \
                live-server-artifact.tgz "$EC2_USER@$EC2_HOST:/tmp/live-server-artifact.tgz"; then
              SCP_OK=1
              break
            fi
            echo "scp attempt $i/4 failed (transient SSH connectivity is known-flaky to this host); retrying in 15s..." >&2
            sleep 15
          done
          [ "$SCP_OK" = "1" ] || { echo "scp upload failed after 4 attempts" >&2; exit 1; }

          SSH_OK=0
          for i in 1 2 3 4; do
            if ssh -i ~/.ssh/id_deploy \
                -o IdentitiesOnly=yes \
                -o StrictHostKeyChecking=accept-new \
                -o ConnectTimeout=20 \
                "$EC2_USER@$EC2_HOST" \
                'APP_USER=ec2-user APP_DIR=/home/ec2-user/live-server LOG_DIR=/home/ec2-user/live-server/logs ARTIFACT=/tmp/live-server-artifact.tgz bash -s' \
                < .github/deploy/ec2-unpack-live-server.sh; then
              SSH_OK=1
              break
            fi
            echo "ssh deploy attempt $i/4 failed (transient SSH connectivity is known-flaky to this host); retrying in 15s..." >&2
            sleep 15
          done
          [ "$SSH_OK" = "1" ] || { echo "ssh deploy failed after 4 attempts" >&2; exit 1; }
# Required GitHub Actions secrets (Environment "staging"):
#   STAGING_EC2_HOST / STAGING_EC2_USER / STAGING_EC2_SSH_PRIVATE_KEY
# ec2-unpack-live-server.sh defaults to the production layout (APP_USER=olapp,
# APP_DIR=/opt/ol/apps/live-server) — staging's actual OS user is ec2-user and the app lives
# at /home/ec2-user/live-server, so the ssh invocation above overrides APP_USER/APP_DIR/LOG_DIR
# 2026-09-05: retry loop added -- SSH to this host intermittently times out during banner
# exchange while SSM (prodv2) to a different box never failed in the same window, so this is
# specific/intermittent to this EC2's SSH listener. The unpack script is idempotent, so
# retrying the whole ssh call is safe even on a failure that happens after the connection banner.
# explicitly (mirrors ol-node-rest's staging.yml, which does the same for its own script).
# Without this override the script's privilege check rejects ec2-user with
# "must run as olapp or root" — this is what broke the very first staging deploy attempt.
