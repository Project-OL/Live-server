# Unit + money concurrency tests (LIVE-52 part 2). Runs on every push to master and on PRs.
# Never deploys; the throwaway Postgres/Redis are CI service containers.
name: Tests

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: money
          POSTGRES_PASSWORD: money
          POSTGRES_DB: money_test
        ports: ["55432:5432"]
        options: >-
          --health-cmd "pg_isready -U money -d money_test"
          --health-interval 2s --health-timeout 3s --health-retries 30
      redis:
        image: redis:7-alpine
        ports: ["56379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      # postinstall runs `prisma generate`; the money tests pin their own URLs in tests/money/helpers.mjs.
      DATABASE_URL: postgresql://money:money@127.0.0.1:55432/money_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Static checks (no Redis KEYS, wallet cache keys confined)
        run: npm run check:redis-keys && npm run check:wallet-cache
      - name: Unit tests
        run: npm run test:unit
      # Since 2026-10-21 every money write goes through ol-node-rest's internal ledger API (BE-20;
      # Live-server's local money code is retired), so the money tests run against the real one:
      # ol-node-rest's tests/ledger/serve-internal.ts on the same throwaway Postgres + Redis.
      - name: Check out ol-node-rest (the money service)
        uses: actions/checkout@v4
        with:
          repository: Project-OL/ol-node
          ref: main
          path: ol-node-rest
      - name: Install ol-node-rest and push its schema to ledger_test
        working-directory: ol-node-rest
        run: |
          npm ci --no-audit --no-fund
          npx prisma generate
          PGPASSWORD=money psql -h 127.0.0.1 -p 55432 -U money -d money_test -c "CREATE DATABASE ledger_test"
          DATABASE_URL=postgresql://money:money@127.0.0.1:55432/ledger_test npx prisma db push --skip-generate --accept-data-loss
      - name: Start the internal ledger API
        working-directory: ol-node-rest
        env:
          REKOGNITION_COLLECTION_ID: ci-test
        run: |
          nohup npx tsx tests/ledger/serve-internal.ts > /tmp/ledger.log 2>&1 &
          for i in $(seq 1 90); do
            code=$(curl -s -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:3199/internal/v1/ledger/gift || true)
            if [ "$code" = 401 ]; then echo "ledger API up after ${i}s"; exit 0; fi
            sleep 1
          done
          cat /tmp/ledger.log; exit 1
      - name: Money concurrency tests (through the real ledger API)
        env:
          MONEY_TEST_DATABASE_URL: postgresql://money:money@127.0.0.1:55432/ledger_test
          LIVE_LEDGER_BASE_URL: http://127.0.0.1:3199
          INTERNAL_LEDGER_HMAC_SECRET: test-internal-ledger-secret-at-least-32-chars
        run: npm run test:money
      - name: Ledger API log
        if: failure()
        run: cat /tmp/ledger.log || true
