name: Staging build and deploy

on:
  push:
    branches: [staging]
  workflow_dispatch:

concurrency:
  group: staging-ec2-live-server
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies (validate lockfile + Prisma)
        run: npm ci
        env:
          DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/ci

      - name: Pack artifact
        run: |
          tar -czf live-server-artifact.tgz \
            --exclude=node_modules \
            --exclude=.git \
            --exclude=.env \
            --exclude=scratch \
            --exclude=exp.js \
            --exclude=test-creds.txt \
            --exclude=google-credentials.json \
            server.js package.json package-lock.json prisma prisma.config.ts src public
          ls -lh live-server-artifact.tgz

      - name: Upload GitHub Actions artifact
        uses: actions/upload-artifact@v4
        with:
          name: live-server-staging-${{ github.sha }}
          path: live-server-artifact.tgz
          retention-days: 14

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4

      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: live-server-staging-${{ github.sha }}

      - name: Check staging EC2 secrets
        env:
          KEY: ${{ secrets.STAGING_EC2_SSH_PRIVATE_KEY }}
          HOST: ${{ secrets.STAGING_EC2_HOST }}
          USER: ${{ secrets.STAGING_EC2_USER }}
        run: |
          if [ -z "$KEY" ] || [ -z "$HOST" ] || [ -z "$USER" ]; then
            echo "Set GitHub Environment (staging) or repo secrets:"
            echo "  STAGING_EC2_HOST, STAGING_EC2_USER, STAGING_EC2_SSH_PRIVATE_KEY"
            exit 1
          fi

      - name: Deploy artifact to ol-stag
        env:
          SSH_PRIVATE_KEY: ${{ secrets.STAGING_EC2_SSH_PRIVATE_KEY }}
          EC2_HOST: ${{ secrets.STAGING_EC2_HOST }}
          EC2_USER: ${{ secrets.STAGING_EC2_USER }}
        run: |
          set -euo pipefail
          EC2_HOST="$(printf '%s' "$EC2_HOST" | tr -d '\r' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"
          EC2_USER="$(printf '%s' "$EC2_USER" | tr -d '\r' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"
          mkdir -p ~/.ssh
          python3 -c 'import os; from pathlib import Path; k=os.environ["SSH_PRIVATE_KEY"].replace("\r\n","\n").replace("\r","\n"); k=k.replace("\\n","\n") if k.count("\n")<2 else k; k=k.strip()+"\n"; assert "BEGIN" in k and "PRIVATE KEY" in k, "STAGING_EC2_SSH_PRIVATE_KEY does not look like a PEM private key"; p=Path.home()/".ssh"/"id_deploy"; p.write_text(k, encoding="utf-8"); p.chmod(0o600)'
          ssh-keygen -y -f ~/.ssh/id_deploy >/dev/null
          echo "SSH key ok, fingerprint=$(ssh-keygen -lf ~/.ssh/id_deploy | awk '{print $2}')"
          SSH_OPTS=(
            -i "$HOME/.ssh/id_deploy"
            -o IdentitiesOnly=yes
            -o StrictHostKeyChecking=accept-new
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts"
            -o ConnectTimeout=20
            -o ServerAliveInterval=15
            -o ServerAliveCountMax=120
            -o TCPKeepAlive=yes
            -o BatchMode=yes
            -o LogLevel=ERROR
          )
          echo "Testing SSH ${EC2_USER}@${EC2_HOST} ..."
          if ! ssh "${SSH_OPTS[@]}" "${EC2_USER}@${EC2_HOST}" "echo ssh-ok"; then
            echo "::error::SSH to ol-stag failed. Common causes:"
            echo "  1) EC2 security group does not allow inbound TCP 22 from GitHub-hosted runners (allow 0.0.0.0/0:22 on ol-stag, or GitHub Actions CIDRs)."
            echo "  2) STAGING_EC2_HOST is wrong (must be 3.110.118.179)."
            echo "  3) STAGING_EC2_SSH_PRIVATE_KEY is not the ol-stag PEM, or was pasted as one line without real newlines."
            ssh "${SSH_OPTS[@]}" -o LogLevel=DEBUG3 -o ConnectTimeout=15 "${EC2_USER}@${EC2_HOST}" true || true
            exit 1
          fi
          scp "${SSH_OPTS[@]}" \
            live-server-artifact.tgz \
            .github/deploy/ec2-unpack-live-server.sh \
            .github/deploy/gha-wrap-unpack.sh \
            "${EC2_USER}@${EC2_HOST}:/tmp/"
          ssh "${SSH_OPTS[@]}" "${EC2_USER}@${EC2_HOST}" \
            'chmod 700 /tmp/gha-wrap-unpack.sh /tmp/ec2-unpack-live-server.sh
             pkill -f gha-wrap-unpack.sh || true
             rm -f /tmp/gha-unpack.exit
             nohup env PATH=/usr/bin:/usr/local/bin:$PATH APP_USER=ec2-user APP_DIR=/home/ec2-user/live-server ARTIFACT=/tmp/live-server-artifact.tgz UNPACK_SCRIPT=/tmp/ec2-unpack-live-server.sh bash /tmp/gha-wrap-unpack.sh > /tmp/gha-unpack.log 2>&1 < /dev/null &
             echo started'
          for i in $(seq 1 90); do
            echo "===== remote unpack poll $i ====="
            ssh "${SSH_OPTS[@]}" "${EC2_USER}@${EC2_HOST}" 'tail -n 40 /tmp/gha-unpack.log; test -f /tmp/gha-unpack.exit && echo GHA_UNPACK_EXIT=$(cat /tmp/gha-unpack.exit)' || true
            if ssh "${SSH_OPTS[@]}" "${EC2_USER}@${EC2_HOST}" 'test -f /tmp/gha-unpack.exit'; then
              code=$(ssh "${SSH_OPTS[@]}" "${EC2_USER}@${EC2_HOST}" 'cat /tmp/gha-unpack.exit')
              echo "remote unpack finished with $code"
              exit "$code"
            fi
            sleep 10
          done
          echo "::error::remote unpack timed out after 15m"
          ssh "${SSH_OPTS[@]}" "${EC2_USER}@${EC2_HOST}" 'tail -n 80 /tmp/gha-unpack.log' || true
          exit 1

      - name: Smoke live root
        run: |
          curl -fsS --max-time 20 https://live-staging.offoolive.com/
          echo
# Required GitHub secrets (Environment "staging" or repo):
#   STAGING_EC2_HOST              3.110.118.179
#   STAGING_EC2_USER              ec2-user
#   STAGING_EC2_SSH_PRIVATE_KEY   PEM for ssh ol-stag
