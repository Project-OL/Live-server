name: Staging build and deploy

# Mirrors production.yml: pack artifact, scp to /tmp, ssh 'bash -s' < unpack.sh
# Staging paths: APP_USER=ec2-user APP_DIR=/home/ec2-user/live-server LOG_DIR=/home/ec2-user/logs

on:
  push:
    branches: [staging]
  workflow_dispatch:

concurrency:
  group: staging-ec2-live-server
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies (validate lockfile + Prisma)
        run: npm ci
        env:
          DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/ci

      - name: Pack artifact
        run: |
          tar -czf live-server-artifact.tgz \
            --exclude=node_modules \
            --exclude=.git \
            --exclude=.env \
            --exclude=scratch \
            --exclude=exp.js \
            --exclude=test-creds.txt \
            --exclude=google-credentials.json \
            server.js package.json package-lock.json prisma prisma.config.ts src public
          ls -lh live-server-artifact.tgz

      - name: Upload GitHub Actions artifact
        uses: actions/upload-artifact@v4
        with:
          name: live-server-${{ github.sha }}
          path: live-server-artifact.tgz
          retention-days: 14

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4

      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: live-server-${{ github.sha }}

      - name: Check staging EC2 secrets
        env:
          KEY: ${{ secrets.STAGING_EC2_SSH_PRIVATE_KEY }}
          HOST: ${{ secrets.STAGING_EC2_HOST }}
          USER: ${{ secrets.STAGING_EC2_USER }}
        run: |
          if [ -z "$KEY" ] || [ -z "$HOST" ] || [ -z "$USER" ]; then
            echo "Set Environment staging secrets: STAGING_EC2_HOST, STAGING_EC2_USER, STAGING_EC2_SSH_PRIVATE_KEY"
            exit 1
          fi

      - name: Deploy to EC2
        env:
          SSH_PRIVATE_KEY: ${{ secrets.STAGING_EC2_SSH_PRIVATE_KEY }}
          EC2_HOST: ${{ secrets.STAGING_EC2_HOST }}
          EC2_USER: ${{ secrets.STAGING_EC2_USER }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -H "$EC2_HOST" >> ~/.ssh/known_hosts || true
          scp -i ~/.ssh/id_deploy \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=accept-new \
            -o ConnectTimeout=20 \
            live-server-artifact.tgz "$EC2_USER@$EC2_HOST:/tmp/live-server-artifact.tgz"
          ssh -i ~/.ssh/id_deploy \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=accept-new \
            -o ConnectTimeout=20 \
            -o ServerAliveInterval=15 \
            -o ServerAliveCountMax=120 \
            -o TCPKeepAlive=yes \
            "$EC2_USER@$EC2_HOST" \
            'APP_USER=ec2-user APP_DIR=/home/ec2-user/live-server LOG_DIR=/home/ec2-user/logs ARTIFACT=/tmp/live-server-artifact.tgz bash -s' \
            < .github/deploy/ec2-unpack-live-server.sh
# Same as production.yml (scp + bash -s < unpack). Staging layout:
#   APP_DIR=/home/ec2-user/live-server LOG_DIR=/home/ec2-user/logs
# Secrets: STAGING_EC2_HOST, STAGING_EC2_USER, STAGING_EC2_SSH_PRIVATE_KEY
